# OpenDroneLab airframe + scenario registry (multi-airframe Phase A, ODL-93).
#
# Single source for which PX4 SITL airframe (MODEL) a regression scenario
# flies, the Gazebo instance name ground truth must track, camera topics, the
# OpenVINS overlay, and whether VIO is scored. Read by
# scripts/airframe_registry.py (used by run-regression.sh, run-vio-stress.sh
# and run-baseline.sh). Gates stay in config/regression_thresholds.yaml.
#
# Rules:
# - The five VIO-shadow scenarios keep MODEL=gz_x500_mono_cam and their
#   exact pre-registry world + overlay.
# - GPS stays the default everywhere (EKF2_EV_CTRL=0). Nothing here enables EV.
# - MODEL is part of the scenario fingerprint (ODL-92), so mc_gps (gz_x500 on
#   vio_test, no overlay) and fw_mission hash differently from any other
#   airframe on the same world. See docs/localization.md for the hashes.
#
# Placeholders in camera topics: {world} and {instance}.

airframes:
  gz_x500_mono_cam:
    sys_autostart: 4010
    vehicle_class: multicopter
    # Spawned Gazebo instance = ${MODEL#gz_}_0
    gz_instance: x500_mono_cam_0
    camera: true
    camera_image_topic: /world/{world}/model/{instance}/link/camera_link/sensor/imager/image
    camera_info_topic: /world/{world}/model/{instance}/link/camera_link/sensor/imager/camera_info
    openvins_overlay: config/openvins/gz_x500_mono_cam
  gz_x500:
    sys_autostart: 4001
    vehicle_class: multicopter
    gz_instance: x500_0
    # Base quad: GPS/IMU/mag/baro only, no camera -> EKF2-only scoring.
    camera: false
    camera_image_topic: null
    camera_info_topic: null
    openvins_overlay: null
  gz_rc_cessna:
    # Phase B fixed-wing (ODL-93). Stock PX4 v1.17 model, no camera.
    sys_autostart: 4003
    vehicle_class: fixed_wing
    gz_instance: rc_cessna_0
    camera: false
    camera_image_topic: null
    camera_info_topic: null
    openvins_overlay: null
    # Airborne scoring band, m AGL (GT): skips the runway roll and flare,
    # covers the 30-40 m mission. Multicopters use the 0.5-20 m default.
    airborne_agl: [3.0, 200.0]

scenarios:
  baseline:
    airframe: gz_x500_mono_cam
    world: vio_test
    openvins_overlay: config/openvins/gz_x500_mono_cam
    score_vio: true
  low_texture:
    airframe: gz_x500_mono_cam
    world: vio_low_texture
    openvins_overlay: config/openvins/gz_x500_mono_cam_low_texture
    score_vio: true
  faster_motion:
    airframe: gz_x500_mono_cam
    world: vio_test
    openvins_overlay: config/openvins/gz_x500_mono_cam_fast_motion
    score_vio: true
  faster_motion_aggressive:
    airframe: gz_x500_mono_cam
    world: vio_test
    openvins_overlay: config/openvins/gz_x500_mono_cam_fast_motion
    score_vio: true
  wind:
    airframe: gz_x500_mono_cam
    world: vio_wind
    openvins_overlay: config/openvins/gz_x500_mono_cam
    score_vio: true
  mc_gps:
    # Phase A second multicopter: plain gz_x500, GPS only, same C++ 10 m
    # square on vio_test. No OpenVINS, no camera bridge; EKF2 vs GT only.
    # In the default regression list and gating since 2026-11-13 (Pallab).
    airframe: gz_x500
    world: vio_test
    openvins_overlay: null
    score_vio: false
  fw_mission:
    # Phase B: stock gz_rc_cessna, GPS only, programmatic PX4 Auto Mission
    # (scripts/fw_mission.py: runway takeoff, racetrack, 20 s loiter,
    # DO_LAND_START + glide-slope landing, auto-disarm). Vendored stock
    # world worlds/default.sdf (500x500 m, byte-identical to PX4 v1.17).
    # EKF2 vs GT only; non_gating until calibrated.
    airframe: gz_rc_cessna
    world: default
    openvins_overlay: null
    score_vio: false
    flight: fw_mission
    bag_duration: 240
    flight_wall: 400
