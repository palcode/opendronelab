%YAML:1.0 # need to specify the file type at the top!

verbosity: "INFO"

use_fej: true
integration: "rk4"
use_stereo: false
max_cameras: 1

# Allow small refinements of SDF extrinsics / timeshift in sim.
calib_cam_extrinsics: true
calib_cam_intrinsics: false
calib_cam_timeoffset: true
calib_imu_intrinsics: false
calib_imu_g_sensitivity: false

max_clones: 11
max_slam: 50
max_slam_in_update: 25
max_msckf_in_update: 40
dt_slam_delay: 1

gravity_mag: 9.81

feat_rep_msckf: "GLOBAL_3D"
feat_rep_slam: "ANCHORED_MSCKF_INVERSE_DEPTH"
feat_rep_aruco: "ANCHORED_MSCKF_INVERSE_DEPTH"

try_zupt: false
zupt_chi2_multipler: 0
zupt_max_velocity: 0.1
zupt_noise_multiplier: 10
zupt_max_disparity: 0.5
zupt_only_at_beginning: false

# Dyn init restored (matches bag 123624 / 0.15 m). Static-only missed takeoff
# init on retest run3. Feature-wait still gates arm; init typically ~0.25s pre-liftoff.
init_window_time: 1.5
init_imu_thresh: 0.5
init_max_disparity: 5.0
init_max_features: 50

init_dyn_use: true
init_dyn_mle_opt_calib: false
init_dyn_mle_max_iter: 50
init_dyn_mle_max_time: 0.05
init_dyn_mle_max_threads: 4
init_dyn_num_pose: 6
init_dyn_min_deg: 5.0

init_dyn_inflation_ori: 10
init_dyn_inflation_vel: 100
init_dyn_inflation_bg: 10
init_dyn_inflation_ba: 100
init_dyn_min_rec_cond: 1e-12

init_dyn_bias_g: [0.0, 0.0, 0.0]
init_dyn_bias_a: [0.0, 0.0, 0.0]

record_timing_information: false
record_timing_filepath: "/tmp/traj_timing.txt"

save_total_state: false
filepath_est: "/tmp/ov_estimate.txt"
filepath_std: "/tmp/ov_estimate_std.txt"
filepath_gt: "/tmp/ov_groundtruth.txt"

use_klt: true
num_pts: 250
fast_threshold: 12
grid_x: 5
grid_y: 5
min_px_dist: 10
knn_ratio: 0.70
track_frequency: 31.0
downsample_cameras: false
num_opencv_threads: 4
histogram_method: "CLAHE"

use_aruco: false
num_aruco: 1024
downsize_aruco: true

up_msckf_sigma_px: 1
# Tighten chi² (was 1) to reject mid-flight MSCKF/SLAM updates that yank
# position when covariance is already inflated. Snaps in bags 20261110_102931
# (~0.80 m / 5 ms, dyaw ~0, t~39.6 s), 20261110_104942 (~1.71 m / 4 ms,
# t~30.2 s), and 20261109_223318 (~0.79 m / 6 ms, t~37.0 s) showed a
# translation jump with almost no yaw and a cov drop after the update.
# try_zupt is already false. Do not loosen regression gates.
up_msckf_chi2_multipler: 0.5
up_slam_sigma_px: 1
up_slam_chi2_multipler: 0.5
up_aruco_sigma_px: 1
up_aruco_chi2_multipler: 1

use_mask: false

relative_config_imu: "kalibr_imu_chain.yaml"
relative_config_imucam: "kalibr_imucam_chain.yaml"
