%YAML:1.0 # need to specify the file type at the top!

# Faster-motion overlay ONLY (yaw-spin + cruise_speed stress). Do NOT use as
# the vio_test default — leave gz_x500_mono_cam/estimator_config.yaml alone.
# Tuned after bags 155436 (Umeyama xy 0.46) vs 163102 (5.22): both jump ~4s
# after takeoff during spinning climb; bad run scale-blows (pathlen 1.45) and
# z-dives. More tracks + slightly longer init window; flight side delays spin
# until after wp0 and caps yaw rate.

verbosity: "INFO"

use_fej: true
integration: "rk4"
use_stereo: false
max_cameras: 1

# Allow small refinements of SDF extrinsics / timeshift in sim.
calib_cam_extrinsics: true
calib_cam_intrinsics: false
calib_cam_timeoffset: true
calib_imu_intrinsics: false
calib_imu_g_sensitivity: false

max_clones: 11
max_slam: 80
max_slam_in_update: 40
max_msckf_in_update: 40
dt_slam_delay: 1

gravity_mag: 9.81

feat_rep_msckf: "GLOBAL_3D"
feat_rep_slam: "ANCHORED_MSCKF_INVERSE_DEPTH"
feat_rep_aruco: "ANCHORED_MSCKF_INVERSE_DEPTH"

try_zupt: false
zupt_chi2_multipler: 0
zupt_max_velocity: 0.1
zupt_noise_multiplier: 10
zupt_max_disparity: 0.5
zupt_only_at_beginning: false

# Dyn init restored (matches bag 123624 / 0.15 m). Static-only missed takeoff
# init on retest run3. Feature-wait still gates arm; init typically ~0.25s pre-liftoff.
init_window_time: 2.0
init_imu_thresh: 0.5
init_max_disparity: 5.0
init_max_features: 50

init_dyn_use: true
init_dyn_mle_opt_calib: false
init_dyn_mle_max_iter: 80
init_dyn_mle_max_time: 0.10
init_dyn_mle_max_threads: 4
init_dyn_num_pose: 6
init_dyn_min_deg: 3.0

init_dyn_inflation_ori: 10
init_dyn_inflation_vel: 100
init_dyn_inflation_bg: 10
init_dyn_inflation_ba: 100
init_dyn_min_rec_cond: 1e-12

init_dyn_bias_g: [0.0, 0.0, 0.0]
init_dyn_bias_a: [0.0, 0.0, 0.0]

record_timing_information: false
record_timing_filepath: "/tmp/traj_timing.txt"

save_total_state: false
filepath_est: "/tmp/ov_estimate.txt"
filepath_std: "/tmp/ov_estimate_std.txt"
filepath_gt: "/tmp/ov_groundtruth.txt"

use_klt: true
num_pts: 350
fast_threshold: 8
grid_x: 6
grid_y: 6
min_px_dist: 7
knn_ratio: 0.70
track_frequency: 31.0
downsample_cameras: false
num_opencv_threads: 4
histogram_method: "CLAHE"

use_aruco: false
num_aruco: 1024
downsize_aruco: true

up_msckf_sigma_px: 1
# chi² restored to 1. 0.5 (commit 114c033) was tried on all three sim
# overlays; it made low_texture diverge (1/5 PASS, three 100+ m blow-ups
# and one unpublished). Keep 0.5 only on the baseline overlay
# (gz_x500_mono_cam). Do not loosen regression gates.
up_msckf_chi2_multipler: 1
up_slam_sigma_px: 1
up_slam_chi2_multipler: 1
up_aruco_sigma_px: 1
up_aruco_chi2_multipler: 1

# Camera mask over the x500 forward-camera propeller blades. OpenVINS
# polarity: 255 = ignore, 0 = use (see ov_core Grider_FAST). Same airframe
# camera on all current SITL VIO overlays; not used on hardware_placeholder.
# Diagnostic: /data/results/lt_prop_diag_20261112_201740/. See docs/localization.md.
use_mask: true
mask0: "mask_x500_mono_cam_props.png"

relative_config_imu: "kalibr_imu_chain.yaml"
relative_config_imucam: "kalibr_imucam_chain.yaml"
