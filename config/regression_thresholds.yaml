# OpenDroneLab SITL regression gates (VIO shadow; EKF2_EV_CTRL=0).
# Recalibrated 2026-11-09 Asia/Calcutta from 3× GZ_SEED=1234 flights per
# scenario (threshold_cal_20261109). Per metric:
#   gate = round_up(max(mean + 3σ, 1.5 × worst)), never looser than prior gates.
# See docs/localization.md "Regression threshold calibration".
#
# Flaky runs (NOT used to widen gates):
#   baseline r1 VIO Umeyama xy 3.84 m (r2/r3 ~0.45) — genuine VIO outlier
#   low_texture r2 VIO nan / ov_published=false — OV failed to score

pytest_min_passed: 31

defaults:
  mission: success
  ov_published: true
  # Pooled healthy EKF2 (all 12 runs); faster_motion sets the xy/H floor.
  ekf2_umeyama_xy_rmse_max: 0.60
  ekf2_umeyama_3d_rmse_max: 0.62
  ekf2_origin_h_rmse_max: 0.60
  ekf2_origin_v_rmse_max: 0.13
  ekf2_origin_samples_min: 500
  # Default VIO covers wind-ish; scenarios tighten further.
  vio_umeyama_xy_rmse_max: 1.85
  vio_umeyama_3d_rmse_max: 1.90
  vio_origin_samples_min: 500

scenarios:
  baseline:
    # Healthy VIO from r2/r3 only (r1 excluded as outlier).
    ekf2_umeyama_xy_rmse_max: 0.40
    ekf2_umeyama_3d_rmse_max: 0.42
    ekf2_origin_h_rmse_max: 0.44
    ekf2_origin_v_rmse_max: 0.12
    vio_umeyama_xy_rmse_max: 0.70
    vio_umeyama_3d_rmse_max: 0.70
  low_texture:
    # Healthy VIO from r1/r3 only (r2 OV nan excluded).
    ekf2_umeyama_xy_rmse_max: 0.38
    ekf2_umeyama_3d_rmse_max: 0.40
    ekf2_origin_h_rmse_max: 0.40
    ekf2_origin_v_rmse_max: 0.12
    vio_umeyama_xy_rmse_max: 0.55
    vio_umeyama_3d_rmse_max: 0.56
  faster_motion:
    # All 3 runs healthy; EKF2 xy hits the shared 0.60 floor.
    ekf2_umeyama_xy_rmse_max: 0.60
    ekf2_umeyama_3d_rmse_max: 0.62
    ekf2_origin_h_rmse_max: 0.60
    ekf2_origin_v_rmse_max: 0.13
    vio_umeyama_xy_rmse_max: 0.42
    vio_umeyama_3d_rmse_max: 0.44
  faster_motion_aggressive:
    # Original profile (yaw 0.7 rad/s, hold 0.5 s, spin not delayed).
    # Reported with the same numeric checks as gated faster_motion, but
    # non_gating: a fail here does not fail overall regression.
    non_gating: true
    ekf2_umeyama_xy_rmse_max: 0.60
    ekf2_umeyama_3d_rmse_max: 0.62
    ekf2_origin_h_rmse_max: 0.60
    ekf2_origin_v_rmse_max: 0.13
    vio_umeyama_xy_rmse_max: 0.42
    vio_umeyama_3d_rmse_max: 0.44
  wind:
    # VIO spread 0.33 / 0.63 / 1.09 — gate from all three (no outlier drop).
    ekf2_umeyama_xy_rmse_max: 0.40
    ekf2_umeyama_3d_rmse_max: 0.42
    ekf2_origin_h_rmse_max: 0.44
    ekf2_origin_v_rmse_max: 0.11
    vio_umeyama_xy_rmse_max: 1.85
    vio_umeyama_3d_rmse_max: 1.90
