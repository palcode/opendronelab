# OpenDroneLab SITL regression gates (VIO shadow; EKF2_EV_CTRL=0).
# Recalibrated 2026-11-09 Asia/Calcutta from 3× GZ_SEED=1234 flights per
# scenario (threshold_cal_20261109). Per metric:
#   gate = round_up(max(mean + 3σ, 1.5 × worst)), never looser than prior gates.
# See docs/localization.md "Regression threshold calibration".
#
# Flaky runs (NOT used to widen gates):
#   baseline r1 VIO Umeyama xy 3.84 m (r2/r3 ~0.45) — genuine VIO outlier
#   low_texture r2 VIO nan / ov_published=false — OV failed to score

# pytest gate floor (ODL-126). 272 tests passed on main at 5968da7; the
# floor sits ~8% below that, so merging or retiring a handful of tests does
# not trip it, but losing a whole test file (or collection silently
# shrinking) does. Raise it when the suite grows; never lower it to make a
# run pass.
pytest_min_passed: 250

defaults:
  mission: success
  ov_published: true
  # Pooled healthy EKF2 (all 12 runs); faster_motion sets the xy/H floor.
  ekf2_umeyama_xy_rmse_max: 0.60
  ekf2_umeyama_3d_rmse_max: 0.62
  ekf2_origin_h_rmse_max: 0.60
  ekf2_origin_v_rmse_max: 0.13
  ekf2_origin_samples_min: 500
  # Default VIO covers wind-ish; scenarios tighten further.
  vio_umeyama_xy_rmse_max: 1.85
  vio_umeyama_3d_rmse_max: 1.90
  vio_origin_samples_min: 500

scenarios:
  baseline:
    # Healthy VIO from r2/r3 only (r1 excluded as outlier).
    # Land-and-retry cap (ODL-77, Research review bf94d72..318d53a):
    # init is <=0.65 s, so a retry would hide a regression.
    vio_init_retries_max: 0
    ekf2_umeyama_xy_rmse_max: 0.40
    ekf2_umeyama_3d_rmse_max: 0.42
    ekf2_origin_h_rmse_max: 0.44
    ekf2_origin_v_rmse_max: 0.12
    vio_umeyama_xy_rmse_max: 0.70
    vio_umeyama_3d_rmse_max: 0.70
  low_texture:
    # Known limitation (Pallab, 2026-11-12): still scored against the
    # 2026-11-09 0.55 m VIO xy limit, but non_gating so a fail does not
    # fail overall regression. Same pattern as faster_motion_aggressive.
    # Results before 2026-11-11 (27238b3 pad texture, b2a6b43
    # init_dyn_use: false) are not comparable with later runs.
    # Healthy VIO from r1/r3 only (r2 OV nan excluded).
    non_gating: true
    # May miss liftoff on this world; allow two retries (3 attempts).
    # An overage fails this scenario only (non_gating, so not overall).
    vio_init_retries_max: 2
    ekf2_umeyama_xy_rmse_max: 0.38
    ekf2_umeyama_3d_rmse_max: 0.40
    ekf2_origin_h_rmse_max: 0.40
    ekf2_origin_v_rmse_max: 0.12
    vio_umeyama_xy_rmse_max: 0.55
    vio_umeyama_3d_rmse_max: 0.56
  faster_motion:
    # All 3 runs healthy; EKF2 xy hits the shared 0.60 floor.
    # Same retry cap as baseline (init <=0.65 s).
    vio_init_retries_max: 0
    ekf2_umeyama_xy_rmse_max: 0.60
    ekf2_umeyama_3d_rmse_max: 0.62
    ekf2_origin_h_rmse_max: 0.60
    ekf2_origin_v_rmse_max: 0.13
    vio_umeyama_xy_rmse_max: 0.42
    vio_umeyama_3d_rmse_max: 0.44
  faster_motion_aggressive:
    # Original profile (yaw 0.7 rad/s, hold 0.5 s, spin not delayed, no wp0
    # hold for /ov_msckf/odomimu: run-regression.sh passes HOLD_FOR_TOPIC=).
    # Reported with the same numeric checks as gated faster_motion, but
    # non_gating: a fail here does not fail overall regression.
    non_gating: true
    ekf2_umeyama_xy_rmse_max: 0.60
    ekf2_umeyama_3d_rmse_max: 0.62
    ekf2_origin_h_rmse_max: 0.60
    ekf2_origin_v_rmse_max: 0.13
    vio_umeyama_xy_rmse_max: 0.42
    vio_umeyama_3d_rmse_max: 0.44
  wind:
    # VIO spread 0.33 / 0.63 / 1.09 — gate from all three (no outlier drop).
    # Same retry cap as baseline (init <=0.65 s).
    vio_init_retries_max: 0
    ekf2_umeyama_xy_rmse_max: 0.40
    ekf2_umeyama_3d_rmse_max: 0.42
    ekf2_origin_h_rmse_max: 0.44
    ekf2_origin_v_rmse_max: 0.11
    vio_umeyama_xy_rmse_max: 1.85
    vio_umeyama_3d_rmse_max: 1.90
  mc_gps:
    # Multi-airframe Phase A (ODL-93): plain gz_x500 (no camera), GPS only
    # (EKF2_EV_CTRL=0), default C++ 10 m square on vio_test. EKF2 vs GT only:
    # score_vio false drops the VIO defaults and the ov_published check.
    # PROVISIONAL EKF2 gates from N=5 GZ_SEED=1234 flights, 2026-11-13
    # Asia/Calcutta at 7fbf0f4 (regression_20261113_194115 .. _195300), same
    # rule: round_up(max(mean + 3σ, 1.5 × worst)); 1.5 × worst dominates. All
    # tighter than the inherited defaults. 5/5 pass, pass@1 5/5, 0 retries.
    # Promoted to GATING 2026-11-13 ~20:34 Asia/Calcutta (Pallab) with these
    # provisional gates unchanged; in the default run-regression.sh list.
    # See docs/simulation-guide.md "mc_gps calibration".
    score_vio: false
    ov_published: false
    ekf2_umeyama_xy_rmse_max: 0.39
    ekf2_umeyama_3d_rmse_max: 0.41
    ekf2_origin_h_rmse_max: 0.43
    ekf2_origin_v_rmse_max: 0.12
  fw_mission:
    # Multi-airframe Phase B (ODL-93): stock gz_rc_cessna, GPS only
    # (EKF2_EV_CTRL=0), PX4 Auto Mission (scripts/fw_mission.py) on the
    # vendored stock worlds/default.sdf. EKF2 vs GT only, airborne band
    # 3-200 m AGL. non_gating; opt-in. Until N>=5 calibration the EKF2
    # limits are the inherited defaults (report-only).
    non_gating: true
    score_vio: false
    ov_published: false
