# DISABLED. This file lives outside .github/workflows/ so GitHub will not
# run it. Do not move or copy it there until Pallab Sarkar has approved
# a final CLA text (CLA.md is Harmony HA-CLA-I v1.0 Option Five; not yet in force).
#
# Pin: contributor-assistant/github-action v2.6.1
#      ca4a40a7d1004f18d9960b404b97e5f30a505a08
# The upstream repository is archived; the pin is the v2.6.1 tag SHA.

name: CLA Assistant

on:
  workflow_dispatch:

# The live configuration, once enabled, should use:
#   issue_comment: { types: [created] }
#   pull_request_target: { types: [opened, closed, synchronize] }
# Those events are intentionally omitted here so that even a mistaken
# copy into .github/workflows/ cannot collect signatures against a draft CLA.

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: >-
          (github.event.comment.body == 'recheck' ||
           github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') ||
          github.event_name == 'pull_request_target' ||
          github.event_name == 'workflow_dispatch'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/palcode/opendronelab/blob/main/CLA.md
          branch: main
          allowlist: dependabot[bot],github-actions[bot]
          lock-pullrequest-aftermerge: false
