#
# File-based Dependabot config only. This does not change repository
# settings. CI stays on pull_request (not pull_request_target).

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      cooldown:
        default-days: 7
        semver-major-days: 14
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      cooldown:
        default-days: 7
        semver-major-days: 14
    groups:
      pip-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
      cooldown:
        default-days: 7
        semver-major-days: 14
    open-pull-requests-limit: 3
    # Ignore Ubuntu version bumps: ROS 2 Jazzy only ships binaries for Ubuntu 24.04 (Noble).
    # Digest and patch updates still come through.
    ignore:
      - dependency-name: ubuntu
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
    groups:
      docker-minor-patch:
        update-types:
          - minor
          - patch
