# File-based Dependabot config only. This does not change repository
# settings. CI stays on pull_request (not pull_request_target).

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
