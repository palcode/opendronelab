#
# Zensical docs site. Default token permissions stay read-only.
# pages:write and id-token:write are granted on the deploy job only.
# Deploy runs on workflow_dispatch only so a push or pull request cannot
# publish Pages.

name: Docs site

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - requirements-docs.txt
      - .github/workflows/docs-site.yml
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type publish-docs-site to deploy"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: docs-site-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Zensical
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docs.txt

      - name: Build site
        run: zensical build

      - name: Verify internal pages excluded
        run: |
          set -euo pipefail
          if [ -d site/AGENTS ] || [ -d site/LAUNCH_CHECKLIST ] || [ -d site/community ] || [ -d site/setup-host ]; then
            echo "Error: Internal pages found in site/"
            ls -la site/ || true
            exit 1
          fi
          if grep -r "awaiting user approval" site/ 2>/dev/null; then
            echo "Error: Found 'awaiting user approval' text in built site"
            exit 1
          fi
          echo "✓ Internal pages successfully excluded"

      - name: Upload built site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site
          path: site
          if-no-files-found: error

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Confirm dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "${CONFIRM}" != "publish-docs-site" ]; then
            echo "Refusing to deploy: confirm must be exactly publish-docs-site."
            exit 1
          fi

      - name: Download built site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-site
          path: site

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
