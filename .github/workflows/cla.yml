# CLA-assistant. Pin: contributor-assistant/github-action v2.6.1
#      ca4a40a7d1004f18d9960b404b97e5f30a505a08
# The upstream repository is archived; the pin is the v2.6.1 tag SHA.
#
# Signatures are committed to signatures/version1/cla.json on the
# `cla-signatures` branch (Pallab, #15) using GITHUB_TOKEN. Leave
# `cla-signatures` unprotected so GITHUB_TOKEN can write it. If that
# branch is later protected, add a `repo`-scoped PAT as the Actions
# secret PERSONAL_ACCESS_TOKEN. This workflow must never check out a
# pull-request head.

name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]
  workflow_dispatch:

# Permissions stay on the job, not the workflow. This workflow must
# never check out a pull-request head.

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - name: CLA Assistant
        if: >-
          (github.event.comment.body == 'recheck' ||
           github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') &&
          github.event.issue.pull_request ||
          github.event_name == 'pull_request_target' ||
          github.event_name == 'workflow_dispatch'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/palcode/opendronelab/blob/main/CLA.md
          branch: cla-signatures
          allowlist: dependabot[bot],github-actions[bot],palcode
          lock-pullrequest-aftermerge: false
