# CLA-assistant. Pin: contributor-assistant/github-action v2.6.1
#      ca4a40a7d1004f18d9960b404b97e5f30a505a08
# The upstream repository is archived; the pin is the v2.6.1 tag SHA.
#
# Private-repo notes (no secrets or repo settings were changed here):
# signatures are committed to signatures/version1/cla.json on branch
# `main` using GITHUB_TOKEN. If main is protected, or if signatures
# should live on a separate branch, add a PAT with `repo` scope as the
# Actions secret PERSONAL_ACCESS_TOKEN and point `branch` at that
# branch. Until then, workflow_dispatch / same-repo PRs depend on
# GITHUB_TOKEN being allowed to write that path on `main`.

name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: >-
          (github.event.comment.body == 'recheck' ||
           github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') ||
          github.event_name == 'pull_request_target' ||
          github.event_name == 'workflow_dispatch'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/palcode/opendronelab/blob/main/CLA.md
          branch: main
          allowlist: dependabot[bot],github-actions[bot]
          lock-pullrequest-aftermerge: false
