# Phase 1 Baseline Scenario: Hover Test
# Purpose: Verify basic PX4 SITL + Gazebo + QGroundControl integration

name: phase1-hover
phase: 1
status: not_run
description: |
  Basic flight test: takeoff to 5m, hover for 10s, land.
  Controlled manually via QGroundControl.
  Acceptance per handover plan Phase 1.

# Environment
vehicle: gz_x500  # Standard X500 quadrotor
world: default    # Empty world with flat ground
make_target: make px4_sitl gz_x500
simulator: gazebo-harmonic

# Control
control_method: qgc  # QGroundControl manual control
flight_mode: position  # MC Position Control

# Mission Profile
mission:
  - action: arm
    method: qgc_button
  
  - action: takeoff
    altitude_m: 5.0
    method: qgc_takeoff_action
  
  - action: hover
    duration_s: 10
    altitude_m: 5.0
    tolerance_horizontal_m: 1.0
    tolerance_vertical_m: 0.5
  
  - action: land
    method: qgc_land_action
  
  - action: disarm
    method: automatic

# Expected Duration
duration_estimate_s: 35

# Acceptance Criteria
acceptance:
  - Repeatable launch sequence (PX4 + Gazebo + QGC)
  - QGroundControl connects and displays telemetry
  - Vehicle completes basic flight (takeoff, hover, land)
  - Takeoff reaches 5m ±0.5m
  - Hover stable for 10 seconds
  - Successful landing and auto-disarm
  - No critical errors in PX4 console or logs

# Success Metrics
metrics:
  takeoff_altitude_m: 5.0
  hover_duration_s: 10.0
  position_accuracy_horizontal_m: 1.0
  position_accuracy_vertical_m: 0.5
  total_flight_time_s: ~35

# Logs and Artifacts
logs:
  px4_ulg: logs/phase1-hover/sitl_log_*.ulg
  qgc_telemetry: logs/phase1-hover/qgc_telemetry.tlog
  screenshot: logs/phase1-hover/hover_screenshot.png
  
# Notes
notes: |
  - First scenario to run after Phase 1 setup complete
  - Validates basic PX4 SITL functionality
  - No ROS 2 integration required
  - Baseline for all future scenarios
