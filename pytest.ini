# Repo-root pytest settings, used when pytest is run from the checkout root
# over several packages (run-regression.sh, `pytest ros2_ws/src`). colcon
# runs each package from its own directory and does not read this file.
#
# importlib import mode: the ament lint tests share basenames across
# packages (test_flake8.py, test_pep257.py, test_copyright.py). The default
# "prepend" mode imports them as one top-level module name, so the second
# and third copies failed collection with "import file mismatch".
[pytest]
addopts = --import-mode=importlib
markers =
    linter: ament lint checks
    flake8: flake8 style check
    pep257: pep257 docstring check
    copyright: license header check
